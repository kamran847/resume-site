<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>ارسال موفق</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: #f1f8e9;
            font-family: Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            direction: rtl;
            margin: 0;
        }
        .message-box {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .message-box h2 {
            color: #155724;
        }
        .message-box a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            padding: 10px 20px;
            background-color: #00b894;
            color: white;
            border-radius: 8px;
        }
        .message-box a:hover {
            background-color: #019875;
        }
    </style>
</head>
<body>
    <div class="message-box">
        <h2>رزومه شما با موفقیت ارسال شد ✅</h2>
        <a href="/">بازگشت به صفحه اصلی</a>
    </div>
</body>
</html>
